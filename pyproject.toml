[project]
name = "ragtuto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kiesha", email = "kishoricharpe9@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.3",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "uvicorn>=0.54.0",
    "langchain-groq"
]

[project.scripts]
ragtuto = "ragtuto:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
